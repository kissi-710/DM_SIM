# 型チェック・lint・テスト・ビルドを、push と pull request で実行する。
# Rust 版エンジンの差分テスト(TS 版が基準)は、別のジョブで実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 配布物に Rust 版エンジン(WASM)を含める。無いと、ブラウザの CPU の探索が TS 版になり、約 6 倍遅くなる
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm run build:wasm
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    # npm run test:rust は、TS 版で正解データを作ってから cargo test --release を実行する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust
